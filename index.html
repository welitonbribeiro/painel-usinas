const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha){
  const sal = b64(C.sal), iv = b64(C.iv), dados = b64(C.dados), mac = b64(C.mac);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:sal, iterations:C.iter}, base, 512));
  const kMac = await crypto.subtle.importKey('raw', bits.slice(32), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const junto = new Uint8Array(iv.length + dados.length); junto.set(iv); junto.set(dados, iv.length);
  if (!await crypto.subtle.verify('HMAC', kMac, mac, junto)) throw new Error('senha');
  const kEnc = await crypto.subtle.importKey('raw', bits.slice(0, 32), {name:'AES-CBC'}, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC', iv}, kEnc, dados));
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), e = document.getElementById('e'), s = document.getElementById('s'), bt = document.getElementById('b');
f.onsubmit = async ev => {
  ev.preventDefault(); e.textContent = ''; bt.disabled = true; bt.textContent = 'Abrindo…';
  try {
    if (document.getElementById('lembrar').checked) { try { localStorage.setItem('painel_senha', s.value) } catch (x) {} }
    await abrir(s.value);
  } catch (x) { e.textContent = 'Senha incorreta.'; bt.disabled = false; bt.textContent = 'Abrir painel'; s.select(); }
};
(async () => { let g = null; try { g = localStorage.getItem('painel_senha') } catch (x) {} if (g) { try { await abrir(g) } catch (x) { try { localStorage.removeItem('painel_senha') } catch (y) {} } } })();
